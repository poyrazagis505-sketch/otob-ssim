<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Otobüs Tycoon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--ac:#f59e0b;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:900px;margin:auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
h3{margin:0 0 8px;color:var(--ac)}
button,select,input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:var(--tx)}
button{background:var(--ac);color:#000;border:0;cursor:pointer;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:6px 0;border-bottom:1px solid #334155}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
.big{font-size:28px}small{opacity:.7}
#log{max-height:160px;overflow:auto;font-size:14px}
svg{width:100%;background:#0b1220;border-radius:8px}
</style></head><body><main>
<div id="auth" class="card">
  <h3>🚌 Otobüs Tycoon</h3>
  <p><input id="co" placeholder="Firma adı (kayıt için)"></p>
  <p><input id="em" type="email" placeholder="E-posta"> <input id="pw" type="password" placeholder="Şifre (min 6)"></p>
  <button onclick="auth(false)">Giriş</button> <button onclick="auth(true)">Kayıt ol</button>
  <p id="err" style="color:var(--bad)"></p>
</div>
<div id="game" hidden></div>
</main>
<script>
// ====== AYAR: Supabase > Project Settings > API ======
const SUPABASE_URL='https://XXXX.supabase.co';
const SUPABASE_KEY='SENIN_ANON_PUBLIC_KEY';
// =====================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('tr-TR')+' ₺';
const FUEL=40,SAL=1500,HIRE=5000;
// Resim eklemek için: i yerine img:'img/sprinter.jpg' koyup render'da <img> kullan
const V={
  sprinter:{n:'Mercedes Sprinter',seat:16,p:750000,f:12,i:'🚐'},
  man:{n:"MAN Lion's Coach",seat:46,p:5500000,f:30,i:'🚌'},
  tourismo:{n:'Mercedes Tourismo',seat:50,p:7000000,f:32,i:'🚌'}
};
const C={Samsun:[270,50],Ordu:[345,70],Ankara:[170,120],İstanbul:[45,60]};
const RT={
  r1:{n:'Samsun Merkez – Atakum',a:'Samsun',b:'Samsun',km:14,fare:25,dem:220,trips:8,seat:0},
  r2:{n:'Samsun – Ordu',a:'Samsun',b:'Ordu',km:160,fare:150,dem:90,trips:2,seat:16},
  r3:{n:'Samsun – Ankara',a:'Samsun',b:'Ankara',km:420,fare:450,dem:120,trips:1,seat:40,peron:1},
  r4:{n:'Samsun – İstanbul',a:'Samsun',b:'İstanbul',km:740,fare:650,dem:100,trips:1,seat:40,peron:1}
};
const U={
  peron:{n:'Otogar peronu',p:2000000,d:'Şehirlerarası hatları açar, talep +%20'},
  tesis:{n:'Dinlenme tesisi anlaşması',p:1500000,d:'Memnuniyet hedefi +10'}
};
const IK=[{n:'Yok',c:0},{n:'Su',c:5},{n:'Çay + kek',c:15},{n:'Tam ikram',c:35}];
let user,S;

async function auth(signup){
  $('err').textContent='';
  const email=$('em').value,password=$('pw').value;
  const {data,error}=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(error)return $('err').textContent=error.message;
  if(!data.session)return $('err').textContent='E-postanı doğrula, sonra giriş yap.';
  user=data.user;await load();
}
async function load(){
  const {data}=await sb.from('companies').select('state').eq('user_id',user.id).maybeSingle();
  S=data?data.state:{name:$('co').value||'Yeni Firma',money:100000,day:1,sat:60,ikram:0,drivers:2,upg:{},
    vehicles:[{m:'sprinter',route:'r1'},{m:'sprinter',route:'r1'}],log:['Firma kuruldu! 2 minibüs, 2 şoför.']};
  $('auth').hidden=true;$('game').hidden=false;render();
}
let t;function save(){clearTimeout(t);t=setTimeout(()=>sb.from('companies').upsert({user_id:user.id,name:S.name,state:S,updated_at:new Date()}),600)}
function act(f){f();save();render()}
function buy(m){if(S.money<V[m].p)return;act(()=>{S.money-=V[m].p;S.vehicles.push({m,route:''});S.log.unshift('Satın alındı: '+V[m].n)})}
function hire(){if(S.money<HIRE)return;act(()=>{S.money-=HIRE;S.drivers++;S.log.unshift('Yeni şoför işe alındı')})}
function upg(k){if(S.money<U[k].p||S.upg[k])return;act(()=>{S.money-=U[k].p;S.upg[k]=1;S.log.unshift('Satın alındı: '+U[k].n)})}
function ok(r,v){return V[v.m].seat>=r.seat&&(!r.peron||S.upg.peron)}
function setRoute(i,id){act(()=>{S.vehicles[i].route=id})}
function setIkram(v){act(()=>{S.ikram=+v})}

function tick(){act(()=>{
  const run=S.vehicles.filter((v,i)=>v.route&&i<S.drivers),by={};
  run.forEach(v=>(by[v.route]??=[]).push(v));
  let inc=0,exp=0,pax=0,short=false;
  for(const id in by){
    const r=RT[id],vs=by[id];
    const cap=vs.reduce((a,v)=>a+V[v.m].seat*r.trips,0);
    const dem=Math.round(r.dem*(.5+S.sat/100)*(S.upg.peron?1.2:1));
    const p=Math.min(cap,dem);if(dem>cap)short=true;
    pax+=p;inc+=p*r.fare;
    vs.forEach(v=>exp+=r.km*2*r.trips*V[v.m].f/100*FUEL);
  }
  exp+=S.drivers*SAL+S.vehicles.length*300+pax*IK[S.ikram].c;
  const tgt=40+S.ikram*12+(S.upg.tesis?10:0)-(short?8:0);
  S.sat=Math.max(0,Math.min(100,S.sat+(tgt-S.sat)*.25));
  S.money+=inc-exp;
  S.log.unshift(`Gün ${S.day}: ${pax} yolcu, gelir ${fmt(inc)}, gider ${fmt(exp)}, net ${fmt(inc-exp)}`);
  S.log=S.log.slice(0,30);S.day++;
})}

function map(){
  let s='<svg viewBox="0 0 400 160">';
  const used=new Set(S.vehicles.filter(v=>v.route).map(v=>v.route));
  for(const id in RT){const r=RT[id];if(!used.has(id)||r.a==r.b)continue;
    s+=`<line x1="${C[r.a][0]}" y1="${C[r.a][1]}" x2="${C[r.b][0]}" y2="${C[r.b][1]}" stroke="#f59e0b" stroke-width="3"/>`}
  for(const c in C)s+=`<circle cx="${C[c][0]}" cy="${C[c][1]}" r="6" fill="#22c55e"/><text x="${C[c][0]+9}" y="${C[c][1]+4}" fill="#e2e8f0" font-size="12">${c}</text>`;
  return s+'</svg>';
}

function render(){
  const g=$('game');
  g.innerHTML=`
  <div class="card"><div class="stats"><span>🏢 ${S.name}</span><span>📅 Gün ${S.day}</span>
  <span class="big" style="color:${S.money<0?'var(--bad)':'var(--ok)'}">${fmt(S.money)}</span>
  <span>😊 Memnuniyet %${Math.round(S.sat)}</span><span>👨‍✈️ ${S.drivers} şoför</span></div>
  <p><button onclick="tick()">▶ Günü bitir</button> <button onclick="sb.auth.signOut().then(()=>location.reload())" style="background:#475569;color:#fff">Çıkış</button></p></div>
  <div class="card"><h3>🗺️ Harita</h3>${map()}</div>
  <div class="card"><h3>🚌 Garaj</h3>${S.vehicles.map((v,i)=>`<div class="row"><span>${V[v.m].i} ${V[v.m].n} (${V[v.m].seat} koltuk)${i>=S.drivers?' <small>⚠ şoför yok</small>':''}</span>
    <select onchange="setRoute(${i},this.value)"><option value="">Boşta</option>${Object.entries(RT).filter(([k,r])=>ok(r,v)).map(([k,r])=>`<option value="${k}" ${v.route==k?'selected':''}>${r.n}</option>`).join('')}</select></div>`).join('')}</div>
  <div class="card"><h3>🛒 Araç pazarı</h3>${Object.entries(V).map(([k,v])=>`<div class="row"><span>${v.i} ${v.n} · ${v.seat} koltuk · ${fmt(v.p)}</span><button ${S.money<v.p?'disabled':''} onclick="buy('${k}')">Satın al</button></div>`).join('')}</div>
  <div class="card"><h3>👨‍✈️ Personel & ikram</h3>
    <div class="row"><span>Şoför tut (${fmt(HIRE)} + ${fmt(SAL)}/gün)</span><button ${S.money<HIRE?'disabled':''} onclick="hire()">İşe al</button></div>
    <div class="row"><span>İkram (yolcu başı gider)</span><select onchange="setIkram(this.value)">${IK.map((x,i)=>`<option value="${i}" ${S.ikram==i?'selected':''}>${x.n} (${x.c} ₺)</option>`).join('')}</select></div></div>
  <div class="card"><h3>🏗️ Yatırımlar</h3>${Object.entries(U).map(([k,u])=>`<div class="row"><span>${u.n} · ${fmt(u.p)}<br><small>${u.d}</small></span><button ${S.upg[k]||S.money<u.p?'disabled':''} onclick="upg('${k}')">${S.upg[k]?'Alındı':'Satın al'}</button></div>`).join('')}</div>
  <div class="card"><h3>📜 Günlük</h3><div id="log">${S.log.map(l=>`<div>${l}</div>`).join('')}</div></div>`;
}
sb.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;load()}});
</script></body></html>
